<div id="print-section" class="invoice-container">

  <!-- Mobile/Desktop View Header (Hidden on Print) -->
  <div class="invoice-header no-print">
    <button class="back-btn" routerLink="/user/bills" title="Back to Bills">
      <fa-icon [icon]="faArrowLeft"></fa-icon>
    </button>
    <h4>INVOICE</h4>
    <button class="print-btn" (click)="openPdfPreview()">
      <fa-icon [icon]="faPrint"></fa-icon>
      <span>Print</span>
    </button>
  </div>

  <div class="reverted-banner no-print" *ngIf="bill.reverted">
    <fa-icon [icon]="faRotateLeft"></fa-icon>
    <span>This bill has been reverted. Stock quantities were restored and this invoice is no longer active.</span>
  </div>

  <!-- Invoice content -->
  <div class="invoice-content">
    <app-invoice-template-one *ngIf="details.preferredTemplate !== 'template2'" [data]="invoiceData">
    </app-invoice-template-one>

    <app-invoice-template-two *ngIf="details.preferredTemplate === 'template2'" [data]="invoiceData">
    </app-invoice-template-two>
  </div>
</div>

<!-- ============ Document viewer ============ -->
<div class="viewer-overlay" *ngIf="showPdfModal" (click)="closePdfModal()">
  <div class="viewer-card" role="dialog" aria-modal="true" aria-label="Invoice preview" (click)="$event.stopPropagation()">

    <div class="viewer-bar">
      <button type="button" class="viewer-done" (click)="closePdfModal()">Done</button>
      <div class="viewer-title">
        <span class="viewer-title-main">Invoice</span>
        <span class="viewer-title-sub" *ngIf="bill.purchaserName">{{ bill.purchaserName }}</span>
      </div>
      <span></span>
    </div>

    <!-- Loading -->
    <div class="viewer-state" *ngIf="pdfLoading">
      <div class="viewer-spinner" aria-hidden="true"></div>
      <p class="viewer-state-text">Preparing invoice…</p>
    </div>

    <!-- Error -->
    <div class="viewer-state" *ngIf="pdfError && !pdfLoading">
      <p class="viewer-state-title">Couldn’t create the PDF</p>
      <p class="viewer-state-text">Check your connection and try again.</p>
      <button type="button" class="viewer-pill" (click)="openPdfPreview()">Try Again</button>
    </div>

    <!-- PDF pages -->
    <div class="viewer-body" [hidden]="pdfLoading || pdfError">
      <div #pdfViewer class="pdf-viewer"></div>
    </div>

    <!-- Toolbar -->
    <div class="viewer-toolbar" *ngIf="!pdfLoading && !pdfError">
      <button type="button" class="viewer-tool" (click)="printPdf()">
        <fa-icon [icon]="faPrint"></fa-icon>
        <span>Print</span>
      </button>
      <button type="button" class="viewer-tool" (click)="downloadPdf()">
        <fa-icon [icon]="faDownload"></fa-icon>
        <span>Save</span>
      </button>
      <button type="button" class="viewer-tool" (click)="openShareSheet()">
        <fa-icon [icon]="faShare"></fa-icon>
        <span>Share</span>
      </button>
    </div>

    <!-- Share action sheet (web only; Android uses the native share dialog) -->
    <div class="share-scrim" *ngIf="showShareSheet" (click)="closeShareSheet()">
      <div class="share-sheet" (click)="$event.stopPropagation()">
        <div class="share-group">
          <p class="share-title">Share Invoice</p>
          <button type="button" class="share-action email" (click)="shareViaEmail()">
            <span class="share-action-icon"><fa-icon [icon]="faEnvelope"></fa-icon></span>
            <span class="share-action-text">
              <span class="share-action-label">Attach in Email</span>
              <span class="share-action-sub">Downloads PDF and opens mail</span>
            </span>
          </button>
          <button type="button" class="share-action whatsapp" (click)="shareViaWhatsApp()">
            <span class="share-action-icon"><fa-icon [icon]="faWhatsapp"></fa-icon></span>
            <span class="share-action-text">
              <span class="share-action-label">Share on WhatsApp</span>
              <span class="share-action-sub">Sends PDF as attachment</span>
            </span>
          </button>
        </div>
        <button type="button" class="share-cancel" (click)="closeShareSheet()">Cancel</button>
      </div>
    </div>
  </div>
</div>
